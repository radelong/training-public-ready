worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  # The console token is a bearer capability; do not log URLs or query strings.
  access_log off;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Docker can assign a new address when the API container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/web.crt;
    ssl_certificate_key /etc/nginx/tls/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
      set $academy_api api:8000;
      proxy_pass http://$academy_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
  }
}
