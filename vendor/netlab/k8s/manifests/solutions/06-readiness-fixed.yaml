# Corrected probe for k8s-06: right port, and a path nginx actually serves.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probeapp
  namespace: netlab
  labels: { app: probeapp }
spec:
  replicas: 2
  selector:
    matchLabels: { app: probeapp }
  template:
    metadata:
      labels: { app: probeapp }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
