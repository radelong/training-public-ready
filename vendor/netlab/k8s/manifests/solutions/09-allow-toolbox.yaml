# Answer to k8s-09: keep the default-deny, add a narrow allow for the toolbox.
# Both policies apply; a pod is reachable if ANY policy permits the traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secure-allow-toolbox
  namespace: netlab
spec:
  podSelector:
    matchLabels: { app: secure }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { role: toolbox }
      ports:
        - protocol: TCP
          port: 80
