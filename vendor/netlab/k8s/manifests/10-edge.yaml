# Starting point for the NodePort / kube-proxy drill. There is deliberately
# no Service here -- you create it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: netlab
  labels: { app: edge }
spec:
  replicas: 2
  selector:
    matchLabels: { app: edge }
  template:
    metadata:
      labels: { app: edge }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
