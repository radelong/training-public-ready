# A long-lived pod the drill checks use to curl services from inside the
# cluster. Also handy for you: kubectl -n netlab exec -it toolbox -- sh
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: netlab
  labels:
    app: toolbox
    role: toolbox
spec:
  containers:
    - name: toolbox
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "200m", memory: "64Mi" }
  terminationGracePeriodSeconds: 2
