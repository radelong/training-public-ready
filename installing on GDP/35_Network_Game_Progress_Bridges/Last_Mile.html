{ id:'a12', day:'n3', engine:'bgp', title:'Two Upstreams', from:'priya', subj:'re: re: re: BGP',
  ticket:`Hi again.\n\nOur session to you has been down since your router rebooted on Tuesday. Your logs on our side say "bad peer AS." Hilltop says they're up with you but aren't hearing your IPv4 prefix. And before you ask: no, we can't send you a full table on that router. It has 4 GB of RAM. A full table is about 950,000 routes and wants a lot more than that.\n\nPlease get both sessions up and announce 198.51.100.0/24 and 2001:db8:5000::/40 to both of us.\n\n— Priya, Big River NOC`,
  data:{scenario:1},
  hints:[`Hank here. A BGP session is two routers agreeing on who each other is. Then you only get to announce a network if your router actually has that exact route in its table. Not a smaller piece of it, the exact thing.`,
         `The Big River neighbor has the wrong remote AS: 64501 instead of 64510. Once it comes up, a full table blows past the 1,000-prefix limit, and past what the router can hold anyway, so take a default route only. 198.51.100.0/24 isn't in the routing table, only its four /26s, so add a static route to Null0. The IPv6 network statement has a typo.`,
         `Big River: remote-as 64510, inbound "default only." Add a static route 198.51.100.0/24 → Null0. Fix the network statement to 2001:db8:5000::/40.`],
  done:`Session up, prefixes received, default sent. You've lowered my blood pressure. — Priya`},

{ id:'a13', day:'n3', engine:'bgp', title:'Traffic Engineering', from:'earl', subj:'two pipes',
  ticket:`We pay Big River for a big pipe and Hilltop for a little one. Tonight, almost everything goes out the little one and comes back in the little one. I'd like the reverse.\n\nBodie "fixed" inbound by turning off our announcements to Hilltop completely. So if Big River's fiber gets cut by a backhoe again, we'll be off the internet. Bodie says that's "a later problem." It's later.\n\nAlso, Hilltop's own customers, like the school district's backup line, should be reached through Hilltop directly, not the long way around through Atlanta.\n\n— Earl`,
  data:{scenario:2},
  hints:[`Hank here. Outbound, you pick: tell your router which neighbor you like better. Inbound, you can only suggest: make one path look longer and the rest of the internet will usually take the other. And you can't fail over to a neighbor you aren't talking to.`,
         `Local preference is outbound only. Set it higher on Big River, so 200 beats the default of 100. AS-path prepending is the inbound lever: prepend your own AS a couple of times toward Hilltop so that path looks longer. Turn announcements to Hilltop back on, prepended. Accept Hilltop's customer routes so traffic to them takes the more specific route.`,
         `Big River: local-pref 200. Hilltop: outbound "own prefixes," prepend 2, inbound "default + customer routes."`],
  done:`Big pipe's busy, little pipe's quiet, and I unplugged Big River for ten seconds to check. Everything moved over. Bodie says I shouldn't have done that. Bodie's right. — Earl`},

{ id:'a14', day:'n3', engine:'sim', title:'Hairpin', from:'darlene', features:['shut','nat','dhcp','dns','routes'],
  subj:'our own website',
  ticket:`possumvalley.example is the community website: the fair schedule, the church calendar, lost dogs. It runs on WEB-01 here in the office.\n\nPeople at home say the site is down. People in the office can't load it either, but for a different reason, because nothing is ever simple here.\n\nThe fair is in twenty hours and the schedule is on that website.\n\n— D.`,
  goals:[{t:'conn',from:'isp',to:'ort',proto:'tcp',port:443,lands:'web',label:'Visitors on the internet can load possumvalley.example (TCP 443)'},
         {t:'conn',from:'dpc',name:'possumvalley.example',proto:'tcp',port:443,lands:'web',label:'DARLENE-PC (in the office) can load possumvalley.example'},
         {t:'conn',from:'dpc',name:'bank.example',proto:'tcp',port:443,label:'DARLENE-PC can still reach bank.example'}],
  build:()=>({devs:devs(
    NETCLOUD(500,40,{note:'The public DNS for possumvalley.example points at 198.51.100.57, the office router\'s public address. The rest of the internet is out here too.'}),
    EDGE(500,150,{'Gi0/3':RP()},{'Gi0/3':IF('Gi0/3','198.51.100.56',M31,{desc:'to PVB office'})}),
    RT('ort','PVB-OFFICE',500,280,rports('Gi0/0','Gi0/1'),{'Gi0/0':IF('Gi0/0','198.51.100.57',M31,{nat:'outside'}),'Gi0/1':IF('Gi0/1','192.168.10.1',M24,{nat:'inside'})},[SR('0.0.0.0','0.0.0.0','198.51.100.56')],
      {nat:true,hairpin:false,forwards:[{proto:'tcp',ext:'443',ip:'192.168.10.5',port:'8443'}],svc:{dhcp:{on:true,scopes:[SCOPE('OFFICE','192.168.10.0',M24,'192.168.10.100','192.168.10.150','192.168.10.1','8.8.8.8')]}}}),
    SW('osw','OFFICE-SW',500,400,swports(['Gi0/1','Gi0/2','Gi0/3','Gi0/24'])),
    H('server','web','WEB-01',260,540,'192.168.10.5',M24,'192.168.10.1',{listen:['tcp/443'],desc:'Hosts possumvalley.example. Listens on 443, like a normal web server.'}),
    H('server','odns','OFFICE-DNS',500,560,'192.168.10.2',M24,'192.168.10.1',{dns:'8.8.8.8',desc:'"Same records as the outside, for consistency." -Bodie',svc:{dns:{on:true,zones:['possumvalley.example'],records:[{name:'possumvalley.example',type:'A',value:'198.51.100.57'}],forwarders:[],recurse:true}}}),
    H('pc','dpc','DARLENE-PC',740,540,'','','',{dhcp:true})),
   links:[LK('isp','wan','edge','Gi0/0',{wan:true,bw:1000}),LK('edge','Gi0/3','ort','Gi0/0',{wan:true,bw:1000,tag:'FIBER'}),LK('ort','Gi0/1','osw','Gi0/24'),
     LK('web','eth0','osw','Gi0/1'),LK('odns','eth0','osw','Gi0/2'),LK('dpc','eth0','osw','Gi0/3')],meta:{}}),
  hints:[`Hank here. Two problems. One is a wrong number on a forward. The other is a loop: from inside the building, you're asking the router to send you back inside to yourself, and a lot of routers won't do that unless you tell them to.`,
         `The port forward sends 443 to WEB-01 on port 8443, and nothing is listening there. From the office, Darlene's PC looks up the public address, so the request hits the router's outside address from the inside. Without NAT reflection (hairpin), the router won't forward it. Either turn hairpin on, or give the office its own internal DNS answer (split horizon).`,
         `Fix the forward's internal port to 443. Then either enable hairpin NAT on PVB-OFFICE, or point the office DHCP scope's DNS at 192.168.10.2 and change the internal A record to 192.168.10.5.`],
  done:`The fair schedule loads at home and in the office. Earl printed it anyway "just in case." — D.`},

{ id:'a15', day:'n3', engine:'bgp', title:'Accidental Transit', from:'priya', subj:'URGENT — you are leaking',
  ticket:`Priya again. Not a fun one.\n\nAt 22:31 you started announcing about 40 Hilltop routes to us, and by now we're sending Hilltop-bound traffic through your 10G bundle. Hilltop says the same thing in reverse: they're getting our routes from you, and they prefer customer routes, so a chunk of the internet is now trying to cross a farm town.\n\nAlso, you just joined the Georgia Peering Point. Congrats. Your session to the route server is flapping.\n\nPlease only announce your own prefixes. To anyone.\n\n— Priya`,
  data:{scenario:3},
  hints:[`Hank here. A small network should only ever tell its neighbors about its own addresses. Pass along what you heard from one neighbor to another and you've volunteered to carry their traffic. You can't carry it.`,
         `Both upstream neighbors are set to announce "all routes," so whatever you learn from one goes straight to the other. That's the leak. The IX route server sends 180 prefixes and your max-prefix limit is 100. Its remote AS is also wrong.`,
         `Big River and Hilltop: outbound "own prefixes." IX: remote-as 64530, max-prefix 500, outbound "own prefixes," inbound "all routes."`],
  done:`Leak's gone, IX is up, and our graphs went back to boring. Boring is the nicest thing I can say about a network. — Priya`},

{ id:'a16', day:'n3', engine:'sim', title:'Fair Night', from:'earl', features:['shut','nat','mtu','dhcp','routes'], final:true,
  subj:'THE FAIR',
  ticket:`The fair opens in an hour. The fairgrounds hang off one radio link from the water tower.\n\nRight now: no vendor can take a card. Mae Belle's livestream encoder says "connecting..." forever. The fire department's portable radio gateway at the first-aid tent needs dispatch to reach it, same as the station.\n\nThere are six things plugged into the midway switch. Bodie set up the router "real fast."\n\nIf the funnel cake stand can't take cards, there will be a riot, and I'll be in it.\n\n— Earl`,
  goals:[{t:'conn',from:'pos1',name:'bank.example',proto:'tcp',port:443,size:1500,label:'FUNNEL-CAKE-POS can take cards (bank.example, full-size packets)'},
         {t:'conn',from:'pos4',name:'bank.example',proto:'tcp',port:443,size:1500,label:'QUILT-BOOTH-POS can take cards too'},
         {t:'conn',from:'enc',name:'live.example',proto:'tcp',port:1935,size:1500,label:'LIVESTREAM-ENC can stream to live.example'},
         {t:'conn',from:'isp',to:'frt',proto:'udp',port:5004,lands:'rgw',label:'County dispatch reaches FIRE-RADIO on UDP 5004'},
         {t:'conn',from:'pos1',name:'bank.example',proto:'tcp',port:443,size:1500,fail:{rebootShuffle:true},label:'Generator hiccup: everyone re-leases, cards still work'}],
  build:()=>({devs:devs(
    NETCLOUD(500,40),
    RT('edge','PVB-EDGE',500,150,rports('Gi0/0','Gi0/3'),{'Gi0/0':IF('Gi0/0','203.0.113.2',M30),'Gi0/3':IF('Gi0/3','198.51.100.52',M31,{mtu:1400,desc:'5.8 GHz radio to fairgrounds (encapsulation leaves 1400)'})},
      [SR('0.0.0.0','0.0.0.0','203.0.113.1')],{locked:true,noUnreach:true,note:'Edge router. ICMP unreachables have been off since 2011 and Earl has asked you not to "go poking."'}),
    RT('frt','FAIR-RTR',500,290,rports('Gi0/0','Gi0/1'),{'Gi0/0':IF('Gi0/0','198.51.100.53',M31,{nat:'inside',mtu:1400,desc:'WAN over the radio'}),'Gi0/1':IF('Gi0/1','172.20.0.1',M24,{nat:'inside',desc:'midway'})},[SR('0.0.0.0','0.0.0.0','198.51.100.54')],
      {nat:true,desc:'Set up "real fast." -Bodie',svc:{dhcp:{on:true,scopes:[SCOPE('MIDWAY','172.20.0.0',M24,'172.20.0.100','172.20.0.103','172.20.0.1','8.8.8.8')]}}}),
    SW('msw','MIDWAY-SW',500,410,swports(['Gi0/1','Gi0/2','Gi0/3','Gi0/4','Gi0/5','Gi0/6','Gi0/7','Gi0/24'])),
    H('pos','pos1','FUNNEL-CAKE-POS',90,560,'','','',{dhcp:true}),
    H('pos','pos2','CORN-DOG-POS',230,620,'','','',{dhcp:true}),
    H('pos','pos3','RIDE-TICKETS-POS',370,560,'','','',{dhcp:true}),
    H('pc','off','FAIR-OFFICE',510,630,'','','',{dhcp:true}),
    H('pos','pos4','QUILT-BOOTH-POS',650,560,'','','',{dhcp:true}),
    H('server','enc','LIVESTREAM-ENC',790,620,'','','',{dhcp:true,desc:"First Baptist's encoder. Mae Belle is standing next to it."}),
    H('server','rgw','FIRE-RADIO',920,540,'172.20.0.10',M24,'172.20.0.1',{listen:['udp/5004'],desc:'Portable radio-over-IP gateway at the first-aid tent.'})),
   links:[LK('isp','wan','edge','Gi0/0',{wan:true,bw:1000}),LK('edge','Gi0/3','frt','Gi0/0',{wan:true,bw:440,tag:'5.8 GHz RADIO'}),LK('frt','Gi0/1','msw','Gi0/24'),
     ...['pos1','pos2','pos3','off','pos4','enc','rgw'].map((d,i)=>LK(d,'eth0','msw','Gi0/'+(i+1)))],meta:{}}),
  hints:[`Hank here. Work it like a checklist, from the radio inward: can the router find the internet, does it translate in the right direction, does everybody get an address, do big packets fit through the radio, and can dispatch get in? Five boxes, probably five problems.`,
         `The default route points at .54, but the edge is .52. The WAN interface is marked NAT inside instead of outside. The DHCP pool has four addresses for six clients. The radio leaves a 1400-byte MTU and the edge won't send "fragmentation needed," so you need an MSS clamp. And there's no port forward for dispatch.`,
         `FAIR-RTR: default route → 198.51.100.52; Gi0/0 NAT → outside; Gi0/0 TCP MSS → 1360; scope end → 172.20.0.150; forward UDP 5004 → 172.20.0.10.`],
  done:`Funnel cake: selling. Quilts: selling. Livestream: 212 viewers, which is more than attend the church. Dispatch test came through at the first-aid tent. You did it. Go home. Actually, stay for the pig race. — Earl`}
];

function mkCanvas(vp,onResize){ const cv=h('canvas'); vp.append(cv); const ctx=cv.getContext('2d'); const st={w:1,h:1};

function fiberCompute(D,W){
  const res=[], cabs={};
  const L=(km,dir)=>km*(dir==='d'?D.down.att:D.up.att);

    for(const [name,km,o] of c.onts){ const bend=o&&o.bend&&!W.bendFixed?o.bend:null;
      const ld=base.d+L(km,'d')+D.conn+(bend?bend.down:0), lu=base.u+L(km,'u')+D.conn+(bend?bend.up:0);
      const op=D.optics[optic]; const rxD=op.tx-ld, rxU=D.up.ontTx-lu; const prob=[];
      if(rxD<D.down.ontSens) prob.push('LOS: too little light at the ONT'); else if(rxD<D.down.ontSens+D.margin) prob.push(`only ${(rxD-D.down.ontSens).toFixed(1)} dB of margin downstream`);
      if(rxD>D.down.ontOver) prob.push('ONT receiver overloaded (too hot)');
      if(rxU<op.sens) prob.push('OLT can\'t hear it upstream'); else if(rxU<op.sens+D.margin) prob.push(`only ${(rxU-op.sens).toFixed(1)} dB of margin upstream`);
      if(rxU>op.over) prob.push(`OLT receiver overloaded (${optic} optic)`);
      res.push({cab:cabId,name,km,rxD,rxU,ok:!prob.length,prob,port,bend:!!(o&&o.bend),bendLive:!!bend}); }
    if(c.child){ const ch=c.child; walk(ch.cab,{d:base.d+L(ch.km,'d'),u:base.u+L(ch.km,'u')},optic,port); } };
  for(const p of D.ports){ const optic=W.optic[p.id]; walk(p.cab,{d:D.conn+L(p.feed.km,'d')+p.feed.splices*D.splice,u:D.conn+L(p.feed.km,'u')+p.feed.splices*D.splice},optic,p.id); }
  return {onts:res,cabs};
}

const groundAt=km=>{ for(let i=1;i<GROUND.length;i++){ const [a,ha]=GROUND[i-1],[b,hb]=GROUND[i]; if(km<=b) return ha+(hb-ha)*(km-a)/(b-a); } return GROUND[GROUND.length-1][1]; };
function rfCompute(D,W){
  const b=D.bands[W.band], f=b.f, dist=D.dist; const dish=D.dishes[W.dish];
  const gain=17.8+20*Math.log10(dish.d*f*1);
  const fspl=92.45+20*Math.log10(f)+20*Math.log10(dist);
  const absorb=b.absorb*dist;
  const rsl=W.tx+2*gain-fspl-absorb-D.cableLoss;
  const wd=D.widths[W.width]; const margin=rsl-wd.sens; const need=D.margin+b.rain*dist;
  const eirp=W.tx+gain;
  const yA=D.groundA+W.hA, yB=D.groundB+W.hB;
  const clr=D.obstacles.map(o=>{ const d1=o.km, d2=dist-o.km; const bulge=d1*d2/(12.74*D.k); const r1=17.32*Math.sqrt(d1*d2/(f*dist)); const los=yA+(yB-yA)*d1/dist; const top=o.ground+o.h+bulge; return {...o,bulge,r1,los,top,pct:(los-top)/r1*100}; });
  const worst=clr.reduce((a,c)=>c.pct<a.pct?c:a,clr[0]);
  const cost=dish.cost+(D.masts[W.hB]||0);
  const cap=margin>=need?wd.cap:(margin>=need-6?Math.round(wd.cap*0.5):0);
  return {gain,fspl,absorb,rsl,margin,need,eirp,clr,worst,cost,cap,lic:b.lic,eirpMax:b.eirp,band:b};
}

// =========================== ROUTER ADVERTISEMENTS ===========================
function v6parse(s){ s=String(s||'').trim().toLowerCase(); if(!s) return null; const parts=s.split('::'); if(parts.length>2) return null;
  const hp=x=>x?x.split(':'):[]; const a=hp(parts[0]), b=parts.length===2?hp(parts[1]):[]; if(parts.length===1&&a.length!==8) return null; if(a.length+b.length>8) return null;
  const all=[...a,...Array(8-a.length-b.length).fill('0'),...b]; if(all.some(x=>!/^[0-9a-f]{1,4}$/.test(x))) return null; return all.map(x=>parseInt(x,16)); }
function v6str(arr){ const hx=arr.map(x=>x.toString(16)); let bs=-1,bl=0; for(let i=0;i<8;){ if(arr[i]===0){ let j=i; while(j<8&&arr[j]===0) j++; if(j-i>bl&&j-i>1){ bs=i; bl=j-i; } i=j; } else i++; }
  if(bs<0) return hx.join(':'); return (hx.slice(0,bs).join(':'))+'::'+(hx.slice(bs+bl).join(':')); }
function eui64(mac){ const b=mac.split(':').map(x=>parseInt(x,16)); b[0]^=2; return [(b[0]<<8)|b[1],(b[2]<<8)|0xff,(0xfe<<8)|b[3],(b[4]<<8)|b[5]]; }
function raCompute(D,W){
  const pre=v6parse(W.prefix), plen=+W.plen, life=+W.life, rd=v6parse(W.rdnss), dns6=v6parse(W.dhcpDns);
  const slaac=!!pre&&plen===64&&W.aflag, route=life>0;
  const poolOk=W.dhcp==='stateful'&&(()=>{ const [a]=String(W.pool).split('-'); return !!v6parse(a); })();
  const srvDns=(W.dhcp==='stateless'||W.dhcp==='stateful')&&dns6;
  const res={};
  for(const d of D.devices){ const r={addr:null,route:false,dns:null,why:[]};
    if(d.printer){
      if(W.printerMode==='slaac'){ if(slaac){ r.addr=v6str([...pre.slice(0,4),...eui64(D.mac)]); r.how='SLAAC (EUI-64 from its MAC)'; } else r.why.push(!pre?'No valid prefix in the RA.':plen!==64?`SLAAC needs a /64. The RA says /${plen}.`:'The A flag is off, so SLAAC is not allowed.'); }
      else { if(W.dhcp==='stateful'&&poolOk){ const m={}; for(const part of String(W.res||'').split(/[\s,;]+/).filter(Boolean)){ const [k,v]=part.split('='); if(k&&v&&v6parse(v)) m[k.trim().toLowerCase()]=v6str(v6parse(v)); }
          const mine=m[d.name.toLowerCase()]; r.addr=mine||v6str(v6parse(String(W.pool).split('-')[0])); r.how=mine?'DHCPv6 reservation':'DHCPv6 (first free in pool)'; }
        else r.why.push(W.dhcp==='off'?'Printer is in DHCPv6-only mode, and the DHCPv6 server is off.':W.dhcp==='stateless'?'Printer wants a DHCPv6 address, but the server is stateless (DNS only, no addresses).':'The DHCPv6 pool is not valid.'); }
      r.route=true; res[d.id]=r; continue; }
    if(slaac&&d.slaac){ r.addr=v6str([...pre.slice(0,4),0x2d1+d.id.length*17,0x8f3a,0x11c4,0x7e20+d.id.charCodeAt(0)]); r.how='SLAAC (temporary address)'; }
    else if(W.mflag&&W.dhcp==='stateful'&&d.dhcp6&&d.dhcp6stateful!==false&&poolOk){ r.addr=v6str(v6parse(String(W.pool).split('-')[0])).replace(/1000$/,'10'+d.id.length+'a'); r.how='DHCPv6 (stateful)'; }
    else r.why.push(!pre?'No valid prefix in the RA.':plen!==64?`The RA advertises a /${plen}. SLAAC only works with a /64, so no address.`:!W.aflag?'A flag off: SLAAC not allowed.':'No address source.');
    if(route) r.route=true; else r.why.push('Router lifetime 0: the RA says "don\'t use me as a default router." No default route.');
    if(rd&&d.rdnss){ r.dns=v6str(rd); r.dnsHow='RDNSS (in the RA)'; }
