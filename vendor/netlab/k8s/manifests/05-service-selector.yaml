# BROKEN ON PURPOSE: the Service selector does not match the pod labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: netlab
  labels: { app: shop }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: netlab
spec:
  type: ClusterIP
  selector:
    app: shopp
  ports:
    - name: http
      port: 80
      targetPort: 80
