# BROKEN ON PURPOSE: the memory request cannot be satisfied by any node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bigapp
  namespace: netlab
  labels: { app: bigapp }
spec:
  replicas: 1
  selector:
    matchLabels: { app: bigapp }
  template:
    metadata:
      labels: { app: bigapp }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests:
              cpu: "8"
              memory: "900Gi"
