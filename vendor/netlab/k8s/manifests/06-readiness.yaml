# BROKEN ON PURPOSE: the readiness probe points at a path nginx does not serve,
# so the pods run but never become Ready and the Service gets no endpoints.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probeapp
  namespace: netlab
  labels: { app: probeapp }
spec:
  replicas: 2
  selector:
    matchLabels: { app: probeapp }
  template:
    metadata:
      labels: { app: probeapp }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: probeapp
  namespace: netlab
spec:
  selector: { app: probeapp }
  ports: [{ port: 80, targetPort: 80 }]
