{ id:'b6', day:'g2', engine:'sim', title:'Orphan APs', from:'rosa', features:['shut','vlan','dhcp','dns','wlc'],
  subj:'new APs wont join',
  ticket:`The contractor hung the new access points overnight. The controller shows zero of them. The APs are blinking amber, which the manual says means "searching for controller," and which I say means "searching for a new contractor."\n\nThe contractor says the APs find the controller "with DHCP or DNS, whichever." The old controller was 10.40.0.21. We retired it. The new one is WLC-01.\n\nFirst pitch is 1:05.\n\n— Rosa`,
  goals:[{t:'wlc',ap:'ap1',wlc:'wlc',dnsName:'cisco-capwap-controller.daubers.lan',label:'AP-1B-01 joins WLC-01'},
         {t:'wlc',ap:'ap3',wlc:'wlc',dnsName:'cisco-capwap-controller.daubers.lan',label:'AP-3B-01 joins WLC-01'},
         {t:'wlc',ap:'apc',wlc:'wlc',dnsName:'cisco-capwap-controller.daubers.lan',label:'AP-CLUB-01 joins WLC-01'}],
  build:()=>({devs:devs(
    SW('core','CORE-1',500,110,{'Gi1/0/1':TR(),'Gi1/0/2':TR(),'Gi1/0/3':TR(),'Gi1/0/10':AC(40),'Gi1/0/11':AC(40)},{l3:true,desc:'Core switch in the MDF.',
      ifaces:{'Vlan40':SVI(40,'10.40.0.1',M24,{desc:'servers'}),'Vlan50':SVI(50,'10.50.0.1',M24,{helper:'',desc:'AP management (new)'})}}),
    H('server','dc','STADIUM-DC',150,110,'10.40.0.5',M24,'10.40.0.1',{dns:'10.40.0.5',desc:'DHCP + DNS',svc:{
      dhcp:{on:true,scopes:[SCOPE('AP-MGMT','10.50.0.0',M24,'10.50.0.100','10.50.0.199','10.50.0.1','10.40.0.5',{opt43:'10.40.0.2O'})]},
      dns:DCDNS([{name:'cisco-capwap-controller.daubers.lan',type:'A',value:'10.40.0.21'}],{recurse:false})}}),
    H('wlc','wlc','WLC-01',850,110,'10.40.0.20',M24,'10.40.0.1',{desc:'The new wireless controller. 0 APs joined.'}),
    SW('idf1','IDF-1B',220,300,{'Gi1/0/1':AC(50),'Gi1/0/48':TR()},{desc:'First-base IDF.'}),
    SW('idf3','IDF-3B',500,300,{'Gi1/0/1':AC(50),'Gi1/0/48':TR({allowed:'1,20,30'})},{desc:'Third-base IDF. Uplink trunk was "cleaned up" last winter.'}),
    SW('club','CLUB-SW',780,300,{'Gi1/0/1':AC(1),'Gi1/0/48':TR()},{desc:'Club level. Kenzie patched the new AP in herself. She is very proud of this.'}),
    H('ap','ap1','AP-1B-01',220,470,'','','',{dhcp:true,desc:'Blinking amber.'}),
    H('ap','ap3','AP-3B-01',500,470,'','','',{dhcp:true,desc:'Blinking amber.'}),
    H('ap','apc','AP-CLUB-01',780,470,'','','',{dhcp:true,desc:'Blinking amber, but proudly.'})),
   links:[LK('core','Gi1/0/10','dc','eth0'),LK('core','Gi1/0/11','wlc','eth0'),LK('core','Gi1/0/1','idf1','Gi1/0/48',{bw:10000}),LK('core','Gi1/0/2','idf3','Gi1/0/48',{bw:10000}),LK('core','Gi1/0/3','club','Gi1/0/48',{bw:10000}),
     LK('ap1','eth0','idf1','Gi1/0/1'),LK('ap3','eth0','idf3','Gi1/0/1'),LK('apc','eth0','club','Gi1/0/1')],meta:{}}),
  hints:[`Pops here. An AP fresh out of the box has to get an address, and then it has to learn where its controller lives. It asks DHCP first (option 43), then DNS. Follow one AP from its port all the way to the controller and see where it gets lost.`,
         `The new AP VLAN's interface on CORE-1 has no DHCP helper, so no AP gets an address. IDF-3B's uplink trunk doesn't carry VLAN 50. The club AP is plugged into VLAN 1. And both discovery methods are broken: option 43 has a letter O in it, and the DNS record still points at the retired controller.`,
         `CORE-1 Vlan50 helper → 10.40.0.5. IDF-3B Gi1/0/48 allowed VLANs → 1,20,30,50. CLUB-SW Gi1/0/1 → VLAN 50. Then either set option 43 to 10.40.0.20, or point cisco-capwap-controller.daubers.lan at 10.40.0.20. Fixing both is better.`],
  done:`Controller says 3 of 3 joined, and the other 37 joined as soon as they found it. They're green. Kenzie wants partial credit for the club one. She is not getting it. — Rosa`},

{ id:'b7', day:'g2', engine:'wifi', title:'Club Level, 5 GHz', from:'lou', subj:'club wifi keeps dying',
  ticket:`The club level is where the season-ticket people sit, and the season-ticket people pay for the club level. Their Wi-Fi drops for a minute at a time all afternoon, mostly on the north side.\n\nGordon set it up. He says he used "80-megahertz channels for gig speeds." I want gig speeds. I also want it to work.\n\nThe airport is two miles north. I don't know if that matters. Gordon says it doesn't.\n\n— Lou`,
  data:{band:'5', zone:'the club level', aps:CLUBGRID.aps, points:CLUBGRID.pts, pwr:{low:8,med:14,high:20}, ant:5, pl0:0, n:4, target:-67, ww:1000, wh:700, minWidth:40, init:{ap:[52,100,116,52,100,116,36,52,100,116,132,149].map(ch=>({ch,w:80,pwr:'high'}))},
    radar:{yBelow:250,ch:[52,56,60,64,100,104,108,112,116,120,124,128],label:'52–64 and 100–128'}},
  hints:[`Pops here. Channels 52 through 144 are DFS channels. If an AP hears radar on one, it has to get off and go quiet for a while. The airport weather radar lands on some of them for everybody on the north side. Wider channels mean fewer channels to go around, and two neighbors on overlapping channels take turns.`,
         `Keep the north row off 52–64 and 100–128. At 40 MHz you have twelve channels for twelve APs, so give every AP its own channel, with the north row on 36, 44, 132, 140, 149 or 157. Bring the power down to medium so neighbors two APs apart stop hearing each other.`,
         `40 MHz, medium power. North row: 36, 44, 132, 140. Middle row: 52, 60, 100, 108. South row: 116, 124, 149, 157. If you want Lou's 80 MHz: rows alternate 36/149 (north), 52/100 (middle), 36/149 (south) at medium power.`],
  done:`Club level held all afternoon. The north side didn't drop once. I told Gordon. Gordon said "that's what I would have done." — Lou`},

{ id:'b8', day:'g2', engine:'igmp', title:'Daubie-Vision', from:'kenzie', subj:'the TVs!!!',
  ticket:`ok so I set up "Daubie-Vision"!!! the encoder in the MDF puts six channels out on the TV VLAN: game feed, promo loop, out-of-town scores, kids cartoons, and two more I haven't decided on yet.\n\nthe TVs work!! BUT the wifi on the 3rd base side got really slow at the same time, and Rosa says the outfield switch "has video on it" and there are no TVs out there. Gordon told me to "turn on snooping," so I did, and then all the TVs went black in the 2nd inning, so I turned it back off.\n\npls help, Lou is going to walk by the team store TV at some point. — K`,
  data:{vlan:70, rate:12, channels:[1,2,3,4,5,6], root:'core', apNeeds:'50, 60 and 61',
    sw:{core:{name:'CORE-1',l3:true,svi:'Vlan70 10.70.0.1'},idf1:{name:'IDF-1B'},idf3:{name:'IDF-3B'},club:{name:'CLUB-SW'},of:{name:'IDF-OF'}},
    parent:{idf1:'core',idf3:'core',of:'core',club:'idf1'}, children:{core:['idf1','idf3','of'],idf1:['club']}, quiet:['of'],
    pos:{core:[430,110],idf1:[210,290],idf3:[600,290],club:[110,450],of:[870,290]}, encPos:[150,110],
    tvs:[{id:'tv5',name:'Team store',sw:'core',ch:2,pos:[700,110]},{id:'tv1',name:'1B concourse',sw:'idf1',ch:1,pos:[260,470]},{id:'tv3',name:'Club level',sw:'club',ch:1,pos:[110,600]},
      {id:'tv2',name:'3B bar',sw:'idf3',ch:3,pos:[490,470]},{id:'tv4',name:'Kids zone',sw:'idf3',ch:4,pos:[620,470]}],
    aps:[{id:'ap1',name:'AP-1B-07',sw:'idf1',pos:[380,470]},{id:'ap2',name:'AP-3B-04',sw:'idf3',pos:[750,470]},{id:'ap3',name:'AP-OF-02',sw:'of',pos:[925,470]}],
    init:{sw:{core:{snoop:false,querier:false},idf1:{snoop:false,querier:false},idf3:{snoop:false,querier:false},club:{snoop:false,querier:false},of:{snoop:false,querier:false}},ap:{ap1:'all',ap2:'all',ap3:'all'}}},
  hints:[`Pops here. Without snooping, a switch treats multicast like broadcast: every port on the VLAN gets every channel, including the APs, which put it on the air at the slowest rate they've got. Snooping fixes that by listening for TVs asking to join. But somebody has to keep asking the TVs if they still want it. That's the querier.`,
         `Turn on IGMP snooping on every switch, including the core, so the outfield switch only gets what's asked for. Make CORE-1 the IGMP querier, or the joins time out a few minutes in and the TVs go black. The AP trunks are allowing every VLAN. They only need 50, 60 and 61.`,
         `Snooping on all five switches. Querier on CORE-1. Optional but good: set each AP trunk's allowed VLANs to 50,60,61.`],
  done:`the team store TV is showing the promo loop!!! Lou walked by and said "huh." I'm counting it. — K`},

{ id:'b9', day:'g2', engine:'lb', title:'Mobile Ordering', from:'deshawn', subj:'app orders failing',
  ticket:`We turned on mobile ordering for the doubleheader. Fans order from their seat and pick up at the window. Lou loves it. It's on the scoreboard.\n\nHalf the orders fail. The other half go through but the cart comes up empty at checkout. One guy has ordered the same pretzel nine times.\n\nThe app company says their servers are fine and "it's your load balancer." There are three order servers behind it. I'm told one of them is "being looked at."\n\n— Deshawn`,
  data:{vip:'10.40.1.100:443', rate:800, maxLoad:0.85, cgnShare:0, gwEditable:true,
    servers:[{id:'o1',name:'ORDER-01',ip:'10.40.1.11',listen:8080,cap:500,health:'ok',gw:'core',note:'app listens on 8080'},
      {id:'o2',name:'ORDER-02',ip:'10.40.1.12',listen:8080,cap:500,health:'ok',gw:'core',note:'app listens on 8080'},
      {id:'o3',name:'ORDER-03',ip:'10.40.1.13',listen:8080,cap:500,health:'down',gw:'core',note:'Gordon unplugged it to charge his phone. It is still unplugged.'}],
    init:{port:'80',monitor:'none',alg:'rr',persist:'none',snat:false,weights:{o1:1,o2:1,o3:1},srv:{o1:{state:'enabled',gw:'core'},o2:{state:'enabled',gw:'core'},o3:{state:'enabled',gw:'core'}}}},
  hints:[`Pops here. A load balancer has to send requests to the right port on each server, notice when one's dead, and make sure the answer comes back the way the question went out. And if a server keeps your cart in its own memory, you'd better keep talking to the same server.`,
         `The apps listen on 8080, but the pool sends to 80. With no health monitor, ORDER-03 keeps getting a third of the orders while it's unplugged. The servers' gateway is the core router, so replies skip the load balancer unless you SNAT. And with no persistence, each step of an order lands on a different server.`,
         `Member port → 8080. Monitor → TCP or HTTP. SNAT on (or set every server's gateway to the load balancer). Persistence → cookie or source IP.`],
  done:`Orders are going through and the carts stay full. The pretzel guy got all nine pretzels. He says he's keeping them. — Deshawn`},

{ id:'b10', day:'g2', engine:'sim', title:'What Time Is It', from:'rosa', features:['shut','vlan','dhcp','dns','routes','ntp'],
  subj:'scanners rejecting tickets',
  ticket:`Gate A scanners are rejecting good tickets: "TICKET NOT YET VALID." The mobile tickets have a rotating barcode that changes every 15 seconds, and the scanner has to agree with the ticketing server about what time it is.\n\nThe scanners say it's January 1st, 1970. The ticketing server thinks it's sometime around Tuesday. Gordon configured time sync last winter so the core and edge would "back each other up."\n\nWe have a GPS clock on the press box roof. I don't think anything is using it.\n\n— Rosa`,
  goals:[{t:'ntp',from:'sc1',max:4,label:'GATE-A-SCAN1 has synchronized time (stratum 4 or better)'},
         {t:'ntp',from:'sc2',max:4,label:'GATE-A-SCAN2 has synchronized time (stratum 4 or better)'},
         {t:'ntp',from:'tix',max:4,label:'TIX-SRV has synchronized time (stratum 4 or better)'},
         {t:'conn',from:'sc1',name:'tix.daubers.lan',proto:'tcp',port:443,label:'GATE-A-SCAN1 reaches tix.daubers.lan on TCP 443'}],
  build:()=>{ const P={devs:devs(
    RT('edge','EDGE-RTR',500,60,rports('Gi0/1'),{'Gi0/1':IF('Gi0/1','10.255.0.1',M30,{desc:'to CORE-1'})},[SR('10.0.0.0','255.0.0.0','10.255.0.2')],{desc:'Edge router (internet side not shown).'}),
    SW('core','CORE-1',500,200,{'Gi1/0/1':TR(),'Gi1/0/10':AC(40),'Gi1/0/11':AC(40),'Gi1/0/12':AC(40),'Gi1/0/48':RP()},{l3:true,desc:'Core switch. Serves NTP to anyone who asks.',
      ifaces:{'Vlan30':SVI(30,'10.30.0.1',M22,{helper:'10.40.0.5',desc:'scanners'}),'Vlan40':SVI(40,'10.40.0.1',M24,{desc:'servers'}),...CORE_UP()},routes:[SR('0.0.0.0','0.0.0.0','10.255.0.1')],ntp:'10.255.0.1'}),
    H('clock','gps','GPS-CLOCK',820,90,'10.40.0.10',M24,'10.40.0.1',{gps:true,desc:'GPS antenna on the press box roof. Knows exactly what time it is. Nobody asks it.'}),
    H('server','dc','STADIUM-DC',870,220,'10.40.0.5',M24,'10.40.0.1',{dns:'10.40.0.5',ntp:'10.40.0.1',desc:'DHCP + DNS',svc:{
      dhcp:{on:true,scopes:[SCOPE('SCANNERS','10.30.0.0',M22,'10.30.0.100','10.30.3.200','10.30.0.1','10.40.0.5')]},
      dns:DCDNS([{name:'tix.daubers.lan',type:'A',value:'10.40.0.30'}],{recurse:false})}}),
    H('server','tix','TIX-SRV',820,360,'10.40.0.30',M24,'10.40.0.1',{dns:'10.40.0.5',ntp:'10.40.0.11',listen:['tcp/443'],desc:'Ticketing server. Validates the rotating barcodes.'}),
    SW('idf1','IDF-1B',350,360,{'Gi1/0/1':AC(30),'Gi1/0/2':AC(30),'Gi1/0/48':TR()}),
    H('handheld','sc1','GATE-A-SCAN1',230,520,'','','',{dhcp:true,desc:'Says it is 1970.'}),
    H('handheld','sc2','GATE-A-SCAN2',470,520,'','','',{dhcp:true,desc:'Also says it is 1970. They agree with each other, at least.'})),
   links:[LK('edge','Gi0/1','core','Gi1/0/48'),LK('core','Gi1/0/10','dc','eth0'),LK('core','Gi1/0/11','gps','eth0'),LK('core','Gi1/0/12','tix','eth0'),LK('core','Gi1/0/1','idf1','Gi1/0/48',{bw:10000}),
     LK('sc1','eth0','idf1','Gi1/0/1'),LK('sc2','eth0','idf1','Gi1/0/2')],meta:{}};
   P.devs.edge.ntp='10.255.0.2'; return P; },
  hints:[`Pops here. Time has to come from somewhere that actually knows it. Everything else just passes it along, one step at a time, and each step adds one to the stratum. Two clocks that each ask the other are just agreeing to be wrong together.`,
         `CORE-1 and EDGE-RTR point at each other. That's a loop, so neither one ever syncs. Point CORE-1 at the GPS clock. The scanners get their time server from DHCP, and the SCANNERS scope has no option 42. TIX-SRV points at 10.40.0.11, which doesn't exist.`,
         `CORE-1 NTP server → 10.40.0.10. SCANNERS scope option 42 → 10.40.0.1 (or the GPS clock). TIX-SRV NTP server → 10.40.0.10 (or 10.40.0.1).`],
  done:`Scanners say it's today. Gate A is beeping green. One of the scanners also has the right time zone now, which we never asked for, but I'll take it. — Rosa`},

{ id:'b11', day:'g2', engine:'qos', title:'The Gig Uplink', from:'rosa', subj:'TV truck says the feed is breaking up',
  ticket:`Peach State Sports is carrying game 2. Their truck sends the program feed back to the studio over our 1-gig internet uplink. Between games, their engineer called to say the feed "glitched four times in the 3rd."\n\nGordon set up QoS last year so "video gets priority." Kenzie is also uploading replay clips to social as fast as she can cut them, the ScoreVision cloud backup runs during games, and the fan Wi-Fi is the fan Wi-Fi.\n\nThe ball-strike challenge system, the card machines and the concession phones also go out this pipe. Nobody is allowed to break those.\n\n— Rosa`,
  data:{btn:'Push the policy',
    hops:[{id:'wan',name:'EDGE-RTR → internet (1 Gb)',short:'EDGE → ISP',bw:1000,editable:true,buffer:60,jit:35}],
    flows:[{id:'stream',name:'TV program feed',src:'core',rate:420,mark:34,target:{loss:0.1,jitter:40},goal:'TV feed: under 0.1% loss and 40 ms jitter'},
      {id:'abs',name:'Ball-strike challenges',src:'core',rate:6,mark:46,target:{loss:0.5,jitter:20},goal:'Ball-strike challenge system: under 0.5% loss and 20 ms jitter'},
      {id:'codec',name:"Hal's radio call",src:'core',rate:0.3,mark:46,target:{loss:0.5,jitter:20},goal:"Hal's call: under 0.5% loss and 20 ms jitter"},
      {id:'voice',name:'Concession phones',src:'core',rate:2,mark:46,target:{loss:0.5,jitter:30},goal:'Concession phones: under 0.5% loss and 30 ms jitter'},
      {id:'pos',name:'Card auths',src:'core',rate:4,mark:26,target:{loss:0.5},goal:'Card machines: under 0.5% loss'},
      {id:'clips',name:"Kenzie's replay clips",src:'core',rate:120,mark:18,target:{loss:2},goal:"Kenzie's replay clips: under 2% loss"},
      {id:'backup',name:'ScoreVision cloud backup',src:'core',rate:200,mark:10},
      {id:'wifi',name:'Fan Wi-Fi',src:'core',rate:650,mark:0}],
    init:{hops:{wan:{classes:[{name:'EF',dscp:[46],type:'priority',pct:10},{name:'AF41',dscp:[34],type:'priority',pct:45}]}}}},
  hints:[`Pops here. A priority queue goes to the front of the line every time, so it has to stay small or nothing else ever moves. Real-time talk goes in there. Big video gets a reserved lane that's guaranteed, not a skip-the-line pass. And anything you don't name ends up in the pile with the fan Wi-Fi.`,
         `The TV feed is 420 Mb/s and it's sitting in the priority queue, which is now 55% of the link. Keep priority at 33% or less: EF only. Give AF41 a bandwidth guarantee big enough for 420 Mb/s, and add classes for the card machines (AF31) and Kenzie's clips (AF21).`,
         `EF priority 10%. AF41 bandwidth 45%. AF31 bandwidth 2%. AF21 bandwidth 15%.`],
  done:`The truck says the feed's clean, no glitches from the 3rd inning on. Kenzie's clip of the triple play got 40,000 views. Gordon says the backup "ran a little slow." Good. — Rosa`},

// ============================ PLAYOFF GAME ============================
{ id:'b12', day:'g3', engine:'wifi', title:'Nine Thousand Phones', from:'rosa', subj:'bowl wifi for tonight',
  ticket:`Tonight's sold out: 9,000 with the berm, and the rain delay will put every one of them on their phone at once. We have 72 under-seat APs in the seating bowl. The controller does the channels automatically. The settings below are the ones it shipped with, plus whatever Gordon and Kenzie added.\n\nKenzie made six SSIDs: Fans, Fans-Promo, Fans-5G, Kenzie-Test, Staff, Ops. Gordon set the power to high "for coverage." The radar on the north side is still a thing, same as the club level.\n\nI need this to survive the rain delay. I'll be in the concourse with a poncho and a laptop.\n\n— Rosa`,
  data:{dense:true, aps:BOWL.aps, points:BOWL.pts, ww:1000, wh:370, field:{x:500,y:345,r:175,label:'FIELD',half:true},
    radar:{yBelow:155,ch:[120,124,128],label:'channels 120–128'},
    fans:9000, take:0.45, demand:0.75, cap24:60, maxAir:0.5, maxClients:65,
    covR:{low:30,med:40,high:55}, hearR:{low:75,med:95,high:130}, hear24:{low:70,med:100,high:140},
    ssidOpts:[['6','6 (Fans, Fans-Promo, Fans-5G, Kenzie-Test, Staff, Ops)'],['3','3 (Fans, Staff, Ops)']],
    init:{width:'80',pwr:'high',minRate:'6',steer:false,ssids:'6',unii1:true,unii2:true,unii2e:true,unii3:true}},
  hints:[`Pops here. With this many people you don't want big cells. You want lots of small ones, each on its own channel, so they aren't waiting on each other. Every SSID beacons, and beacons go out at the slowest rate you allow, which eats airtime before anybody's even connected. And the radar is still north of us.`,
         `Go to 20 MHz so there are enough channels to go around, and turn the power to low so neighbors stop hearing each other. Raise the minimum data rate so beacons are cheap and phones don't hang on to an AP across the bowl. Cut down to three SSIDs. Turn on band steering so 2.4 GHz isn't buried. Turn off UNII-2e, which is where the airport radar hits.`,
         `20 MHz, low power, minimum rate 12 or 24 Mb/s, 3 SSIDs, band steering on. Channels: UNII-1, UNII-2 and UNII-3 on, UNII-2e off.`],
  done:`Rain delay was 94 minutes. 4,100 people on the Wi-Fi at once. My laptop never dropped. I was in a poncho the whole time, so I'm calling that a field test. — Rosa`},

{ id:'b13', day:'g3', engine:'pim', title:'The League Feed', from:'kenzie', subj:'suite TVs + the league feed',
  ticket:`ok the league wants the playoff game on the suite TVs, the club TVs AND in the clubhouse video room, using "the multicast feed from the broadcast router." it's 239.10.70.1.\n\nnone of the three places get it. the suites show a fish screensaver, the club TVs say NO SIGNAL, and the clubhouse guy says "this has never worked."\n\nGordon says it's "a PIM thing," and that the rendezvous point "used to be 10.255.0.9." it is not anymore. I don't know what any of this means, but the league is texting Lou. — K`,
  data:{group:'239.10.70.1', srcRouter:'bcast', oldRp:'10.255.0.9',
    routers:{bcast:{name:'BCAST-RTR',lo:'10.255.0.5',x:150,y:110,px:150,py:110,kind:'router'},corea:{name:'CORE-A',lo:'10.255.0.1',x:440,y:110,px:150,py:400},coreb:{name:'CORE-B',lo:'10.255.0.2',x:780,y:110,px:150,py:690},
      fw:{name:'FW-SUITES',lo:'10.255.0.6',x:170,y:480,px:500,py:170,kind:'router',noPim:true,noPimNote:'FW-SUITES is a firewall for the suite POS network. It does not run PIM, and the security people would like it to stay that way.'},
      suites:{name:'DIST-SUITES',lo:'10.255.0.4',x:440,y:380,px:400,py:400},club:{name:'DIST-CLUB',lo:'10.255.0.3',x:780,y:380,px:400,py:690},house:{name:'CLUBHOUSE',lo:'10.255.0.7',x:780,y:560,px:400,py:870,kind:'router'}},
    links:[{id:'l1',a:'bcast',b:'corea'},{id:'l2',a:'corea',b:'coreb'},{id:'l3',a:'corea',b:'suites'},{id:'l4',a:'coreb',b:'club'},{id:'l5',a:'suites',b:'fw'},{id:'l6',a:'fw',b:'corea'},{id:'l7',a:'club',b:'house'},{id:'l8',a:'suites',b:'club'}],
    receivers:[{id:'suites',name:'Suite TVs',router:'suites'},{id:'club',name:'Club TVs',router:'club'},{id:'house',name:'Clubhouse video room',router:'house'}],
    staticOptions:[{router:'suites',to:'corea',via:['fw','club']}],
    init:{ttl:1, static:{suites:{to:'corea',via:'fw'}}, rp:{bcast:'10.255.0.1',corea:'10.255.0.1',coreb:'10.255.0.1',suites:'10.255.0.1',club:'10.255.0.9',house:'10.255.0.9',fw:''},
      pim:{'bcast:l1':true,'corea:l1':true,'corea:l2':true,'coreb:l2':true,'corea:l3':true,'suites:l3':true,'coreb:l4':false,'club:l4':true,'club:l7':true,'house:l7':true,'suites:l8':true,'club:l8':true,'corea:l6':true,'suites:l5':true}}},
  hints:[`Pops here. In sparse mode, a TV's router sends a join toward the rendezvous point, hop by hop, and the stream flows back down that same path. Every router has to agree on where the RP is. Every interface on the path has to speak PIM. The join follows the unicast route to the RP, wherever that goes. And the stream has to live long enough to get there.`,
         `DIST-CLUB and CLUBHOUSE still point at the old RP. CORE-B has PIM off on its link to DIST-CLUB. DIST-SUITES has a static route to CORE-A through the firewall, which doesn't run PIM, so its join dies there. The encoder's TTL is 1, so the stream never makes it past the first router.`,
         `DIST-CLUB and CLUBHOUSE RP → 10.255.0.1. CORE-B: PIM on toward DIST-CLUB. DIST-SUITES: drop the static route (use the routing protocol). BCAST-RTR encoder TTL → 16.`],
  done:`suites: baseball. club: baseball. clubhouse guy: "huh, it works." the league stopped texting Lou. Lou sent me a thumbs up, which he's never done. — K`},

{ id:'b14', day:'g3', engine:'lb', title:'Ordering in the Rain', from:'deshawn', subj:'orders melting down',
  ticket:`Rain delay is coming and everybody's going to order at once. Lou had us add ORDER-04, the big one, and said "the load balancer will figure it out." It isn't figuring it out.\n\nDuring the pregame test: ORDER-01 hit 100% CPU while ORDER-04 sat there bored. About one order in ten comes back "something went wrong," even though every server shows green. And the app company needs ORDER-02 out of rotation tonight to patch it, without killing anybody's open cart.\n\nAlso, most of the people ordering from the parking lot come in on their phone carrier, and the app company says that "breaks stickiness." I don't know what that means. Neither do they.\n\n— Deshawn`,
  data:{vip:'10.40.1.100:443', rate:1000, maxLoad:0.85, cgnShare:0.6, cgnIps:[{ip:'198.51.100.26',w:0.6},{ip:'198.51.100.25',w:0.25},{ip:'203.0.113.41',w:0.15}], patch:'o2', gwEditable:false,
    servers:[{id:'o1',name:'ORDER-01',ip:'10.40.1.11',listen:8080,cap:450,health:'ok',note:'4 cores'},
      {id:'o2',name:'ORDER-02',ip:'10.40.1.12',listen:8080,cap:450,health:'ok',note:'4 cores, needs a patch tonight'},
      {id:'o3',name:'ORDER-03',ip:'10.40.1.13',listen:8080,cap:450,health:'500',note:"Answers on 8080. Answers with HTTP 500 (its database pool filled up an hour ago)."},
      {id:'o4',name:'ORDER-04',ip:'10.40.1.14',listen:8080,cap:900,health:'ok',note:'8 cores. New. Lou is very proud of it.'}],
    init:{port:'8080',monitor:'tcp',alg:'rr',persist:'source',snat:true,weights:{o1:1,o2:1,o3:1,o4:1},srv:{o1:{state:'enabled'},o2:{state:'enabled'},o3:{state:'enabled'},o4:{state:'enabled'}}}},
  hints:[`Pops here. A TCP check only proves somebody picked up the phone. It doesn't prove they said anything sensible. Round robin treats a big server like a little one. Sticking by source address works great until a few thousand people show up from the same address. And to take a server out for work, let it finish the orders it already has.`,
         `Use an HTTP health check so ORDER-03's 500 errors take it out of the pool. Switch to least connections, or to weights that match capacity, so ORDER-04 does its share. The cell carriers' CGNAT puts thousands of phones behind a few addresses, so source-IP persistence piles them onto one server. Use cookie persistence. Set ORDER-02 to drain, not disabled.`,
         `Monitor → HTTP. Load balancing → least connections (or weighted: 1, 1, 1, 2). Persistence → cookie. ORDER-02 → drain.`],
  done:`94-minute rain delay, 11,000 orders, no meltdowns. ORDER-02 got patched in the 4th. Boiled peanuts sold out in the 6th, which is a concessions record. I've been told to tell you "nice." Nice. — Deshawn`},

{ id:'b15', day:'g3', engine:'qos', title:'Contract Rate', from:'hal', subj:'it is happening again',
  ticket:`It's happening again. During the pregame show, my call sounded like a fax machine falling down the stairs. The TV truck says their feed is "dropping packets with no pattern."\n\nRosa says two things changed since the doubleheader. Gordon put a new switch between the core and the edge "for the scoreboard," and the internet circuit got downgraded to save money. The port is still 1 gig, but the contract is 500 megabits, and the provider drops anything over that.\n\nThe QoS policy is the one you built for the doubleheader. It worked. I'd like it to work again.\n\n— Hal`,
  data:{btn:'Push the policy',
    hops:[{id:'gsw',name:'GORDON-SW (between core and edge)',short:'GORDON-SW',bw:10000,bleachable:true,bleachLabel:'"QoS: off" (re-mark everything to DSCP 0). This is ScoreVision\'s default.'},
      {id:'wan',name:'EDGE-RTR → internet (1 Gb port, 500 Mb contract)',short:'EDGE → ISP',bw:1000,policeCir:500,editable:true,buffer:60,jit:35}],
    flows:[{id:'stream',name:'TV program feed',src:'core',rate:300,mark:34,target:{loss:0.1,jitter:40},goal:'TV feed: under 0.1% loss and 40 ms jitter'},
      {id:'abs',name:'Ball-strike challenges',src:'core',rate:6,mark:46,target:{loss:0.5,jitter:20},goal:'Ball-strike challenges: under 0.5% loss and 20 ms jitter'},
      {id:'codec',name:"Hal's radio call",src:'core',rate:0.3,mark:46,target:{loss:0.5,jitter:20},goal:"Hal's call: under 0.5% loss and 20 ms jitter"},
      {id:'voice',name:'Concession phones',src:'core',rate:2,mark:46,target:{loss:0.5,jitter:30},goal:'Concession phones: under 0.5% loss and 30 ms jitter'},
      {id:'pos',name:'Card auths',src:'core',rate:4,mark:26,target:{loss:0.5},goal:'Card machines: under 0.5% loss'},
      {id:'wifi',name:'Fan Wi-Fi',src:'core',rate:700,mark:0}],
    init:{bleach:{gsw:true},hops:{wan:{classes:[{name:'EF',dscp:[46],type:'priority',pct:10},{name:'AF41',dscp:[34],type:'bandwidth',pct:45},{name:'AF31',dscp:[26],type:'bandwidth',pct:2}]}}}},
  hints:[`Pops here. If you hand the provider more than you're paying for, they throw the extra away, and they don't care what's in it. Better to slow yourself down to the contract rate, so the line forms on your side where your rules apply. And check that nobody's scraping the labels off your packets before they get to the router.`,
         `GORDON-SW re-marks everything to DSCP 0, so nothing matches your classes. Turn that off. Then shape EDGE-RTR to 500 Mb/s. Once you shape, the percentages are percentages of 500, not 1,000, so the TV feed needs a bigger share.`,
         `GORDON-SW: QoS-off re-marking off. EDGE-RTR: shape to 500. EF priority 10%, AF41 bandwidth 65%, AF31 bandwidth 2%.`],
  done:`Clean all night. Through the rain delay I told the story about the 1994 bench-clearing brawl, uninterrupted, all twenty-two minutes of it. The station says that's a record. — Hal`},

{ id:'b16', day:'g3', engine:'sim', title:'Rain Delay', from:'lou', features:['shut','vlan','dhcp','dns','stp','ntp','wlc'], final:true,

  ticket:`Lightning in the 6th. The tarp is on, the players are in the clubhouse, and 9,000 people are standing in the concourse.\n\nDeshawn rolled out the rain-delay bar carts in the outfield and none of them can take a card. The outfield AP is dark. Gate A's re-entry scanner says re-entry passes are "from the future." Rosa had to shut a port on the core during the lightning and she'd like it back.\n\nDeshawn also says the registers "only worked four at a time last year" and that he "figured that was normal."\n\nWe resume when the lightning stops. I'd like to resume with the concessions open.\n\n— Lou`,

      dns:DCDNS([{name:'cisco-capwap-controller.daubers.lan',type:'A',value:'10.40.0.20'}])}}),
    H('clock','gps','GPS-CLOCK',880,280,'10.40.0.10',M24,'10.40.0.1',{gps:true,desc:'Press box roof. Still knows what time it is.'}),
    H('wlc','wlc','WLC-01',880,390,'10.40.0.20',M24,'10.40.0.1',{desc:'139 of 140 APs joined.'}),

function mkCanvas(vp,onResize){ const cv=h('canvas'); vp.append(cv); const ctx=cv.getContext('2d'); const st={w:1,h:1};
  const fit=()=>{ const r=vp.getBoundingClientRect(); const dpr=Math.min(2,window.devicePixelRatio||1); st.w=Math.max(1,r.width); st.h=Math.max(1,r.height); cv.width=Math.round(st.w*dpr); cv.height=Math.round(st.h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); dirty=true; onResize&&onResize(); };
  let ro=null; try{ ro=new ResizeObserver(fit); ro.observe(vp); }catch(e){ addEventListener('resize',fit); }
  fit(); return {cv,ctx,st,stop:()=>ro&&ro.disconnect()}; }

function dhcpSim(D,W){ const pool=2**(32-W.prefix)-2-D.reserved; const L=W.lease/60; const pts=[]; let peak=0, peakT=0, outAt=null;

    for(const pv of D.prev){ const ago=(t+24*pv.daysAgo)-pv.left; if(ago>=0&&ago<L) act+=pv.devices*(1-D.returning); }

    act=Math.round(act); pts.push([t,act]); if(act>peak){ peak=act; peakT=t; } if(act>pool&&outAt==null) outAt=t; }
  return {pool,pts,peak,peakT,outAt}; }

// =========================== QoS ===========================
const DSCPN={0:'BE (0)',46:'EF (46)',34:'AF41 (34)',26:'AF31 (26)',18:'AF21 (18)',24:'CS3 (24)',10:'AF11 (10)'};
function qosCompute(D,W){
  let flows=D.flows.map(f=>({...f,dscp:f.mark,loss:0,delay:2,jitter:1,notes:[]}));
  for(const hop of D.hops){ const cfg=W.hops[hop.id]||{};
    // ingress trust / remark
    for(const f of flows){ if(hop.trustSrc&&hop.trustSrc.includes(f.src)){ const tr=(W.trust||{})[f.src]; if(!tr){ if(f.dscp) f.notes.push(`${hop.name}: untrusted port, DSCP ${DSCPN[f.dscp]||f.dscp} re-marked to 0`); f.dscp=0; } } }
    const bl=hop.bleachable?!!(W.bleach||{})[hop.id]:!!hop.bleach; if(bl) for(const f of flows){ if(f.dscp) f.notes.push(`${hop.name}: re-writes every DSCP to 0`); f.dscp=0; }
    const capRaw=hop.bw; const shaped=cfg.shape?+cfg.shape:0; const cap=shaped?Math.min(capRaw,shaped):capRaw;
    const offered=flows.reduce((a,f)=>a+f.rate*(1-f.loss),0);
    const cls=(cfg.classes||[]);
    const qOf=f=>{ const pq=cls.find(k=>k.type==='priority'&&k.dscp.includes(f.dscp)); if(pq) return pq; return cls.find(k=>k.type!=='priority'&&k.dscp.includes(f.dscp))||null; };
    const groups=new Map(); for(const f of flows){ const q=qOf(f); const key=q?q.name:'class-default'; if(!groups.has(key)) groups.set(key,{q,flows:[]}); groups.get(key).flows.push(f); }
    const dem=g=>g.flows.reduce((a,f)=>a+f.rate*(1-f.loss),0);
    const setRes=(g,served,pq)=>{ const d=dem(g); const lr=d>0?Math.max(0,1-served/d):0; for(const f of g.flows){ f.loss=1-(1-f.loss)*(1-lr); const u=d>0?Math.min(1,d/Math.max(served,1e-6)):0;
        if(pq){ f.delay+=1; f.jitter+=0.5; } else if(lr>0.001){ f.delay+=hop.buffer||60; f.jitter+=hop.jit||35; } else if(offered>cap*0.9){ f.delay+=8; f.jitter+=6; } else { f.delay+=1; f.jitter+=0.5; } } };
    if(offered<=cap){ for(const g of groups.values()) setRes(g,dem(g),g.q&&g.q.type==='priority'); }
    else if(!cls.length){ for(const g of groups.values()) setRes(g,dem(g)*cap/offered,false); }
    else { let rem=cap; const pqs=[...groups.values()].filter(g=>g.q&&g.q.type==='priority');
      for(const g of pqs){ const lim=cap*(+g.q.pct||0)/100; const sv=Math.min(dem(g),lim); setRes(g,sv,true); if(dem(g)>lim) g.flows.forEach(f=>f.notes.push(`${hop.name}: priority queue policed at ${g.q.pct}%`)); rem-=sv; }
      const others=[...groups.values()].filter(g=>!(g.q&&g.q.type==='priority'));
      const sumPct=cls.filter(k=>k.type!=='priority').reduce((a,k)=>a+(+k.pct||0),0); const defPct=Math.max(1,100-cls.reduce((a,k)=>a+(+k.pct||0),0));
      const wt=g=>g.q?(+g.q.pct||0):defPct; const alloc=new Map(); let left=rem;
      for(const g of others){ const a=Math.min(dem(g),cap*wt(g)/100); alloc.set(g,a); left-=a; }
      for(let it=0;it<4&&left>1e-6;it++){ const hungry=others.filter(g=>dem(g)-alloc.get(g)>1e-6); const tw=hungry.reduce((a,g)=>a+wt(g),0); if(!tw) break; let used=0; for(const g of hungry){ const add=Math.min(dem(g)-alloc.get(g),left*wt(g)/tw); alloc.set(g,alloc.get(g)+add); used+=add; } left-=used; }
      for(const g of others) setRes(g,Math.max(0,alloc.get(g)),false); }
    if(hop.policeCir){ const out=flows.reduce((a,f)=>a+f.rate*(1-f.loss),0); if(out>hop.policeCir){ const lr=1-hop.policeCir/out; for(const f of flows){ f.loss=1-(1-f.loss)*(1-lr); f.delay+=5; f.jitter+=25; f.notes.push(`${hop.name}: the ISP polices everything above ${hop.policeCir} Mb/s and ignores DSCP`); } } }
  }
  return flows;
}

// =========================== PIM SPARSE MODE ===========================
function pimCompute(D,W){

// =========================== LOAD BALANCER ===========================
function lbCompute(D,W){
  const S=D.servers.map(s=>({...s,...W.srv[s.id]}));
  const reach=s=>{ const why=[]; if(+W.port!==s.listen) why.push(`listens on ${s.listen}, the pool sends to ${W.port}`); if(!W.snat&&s.gw!=='lb') why.push('replies go straight to the core router, skipping the load balancer (asymmetric: client drops them)'); return why; };
  const up=s=>{ if(s.state==='disabled') return false; if(W.monitor==='none') return true; if(+W.port!==s.listen||s.health==='down') return false; if(W.monitor==='tcp') return true; return s.health==='ok'; };
  const inPool=S.filter(s=>up(s)&&s.state!=='drain');
  const capOf=s=>s.cap;
  let share=new Map(); const n=inPool.length;
  if(n){ if(W.alg==='rr') inPool.forEach(s=>share.set(s.id,1/n)); else { const tot=inPool.reduce((a,s)=>a+(W.alg==='weighted'?(+W.weights[s.id]||1):capOf(s)),0); inPool.forEach(s=>share.set(s.id,(W.alg==='weighted'?(+W.weights[s.id]||1):capOf(s))/tot)); } }
  // persistence effect on off-site CGNAT traffic
  if(n&&W.persist==='source'&&D.cgnShare){ const ips=D.cgnIps; const base=new Map(share); const cg=new Map(inPool.map(s=>[s.id,0])); const ord=inPool.map(s=>s.id).sort();
    for(const e of ips){ const ip=e.ip||e, w=e.w!=null?e.w:1/ips.length; const sid=ord[fnv(ip)%ord.length]; cg.set(sid,cg.get(sid)+w); }
    for(const s of inPool) share.set(s.id,base.get(s.id)*(1-D.cgnShare)+cg.get(s.id)*D.cgnShare); }
  let err=0; const rows=S.map(s=>{ const sh=share.get(s.id)||0; const load=sh*D.rate/s.cap; const r=reach(s); const bad=sh>0&&(r.length||s.health!=='ok'); if(bad) err+=sh; return {s,sh,load,why:r.length?r:(s.health!=='ok'&&sh>0?[s.health==='down'?'is down and still getting traffic':'answers TCP but returns HTTP 500 (database pool broken)']:[]),up:up(s),inPool:inPool.includes(s)}; });
  const cart=!n?1:W.persist==='none'?1-Math.pow(1/n,3):0;
  const drainBad=D.patch&&(()=>{ const s=W.srv[D.patch]; return s.state==='disabled'?'disabled hard: every cart on it vanished mid-order':s.state==='enabled'?'still in rotation; it can\'t be patched':null; })();
  return {rows,err:n?err:1,cart,n,drainBad};
}
