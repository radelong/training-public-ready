<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Drive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: top-down forensic lab (canvas hub) with DOM puzzle overlays stacked above it.
   Single committed dark "evidence-room-at-2am" world — intentionally single-theme. */
:root{
  --bg:#070a0f;
  --floor:#0c1119;
  --panel:#101722;
  --panel-2:#0a0f17;
  --edge:#1d2838;
  --fg:#cdd8e6;
  --muted:#6a7a8f;
  --dim:#45566b;
  --accent:#4fd4e0;        /* forensic ice/cyan */
  --accent-dim:#1a5a63;
  --amber:#f2b23e;         /* evidence tag */
  --red:#ff5d5d;
  --blue:#56a8ff;
  --violet:#b48cff;
  --good:#4fd4e0;
  --warn:#f2b23e;
  --crit:#ff5d5d;
  color-scheme:dark;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--mono);text-wrap:balance;margin:0}
code,kbd,.mono{font-family:var(--mono)}
kbd{background:var(--panel);border:1px solid var(--edge);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font-size:.82em;color:var(--fg)}
button{font-family:var(--sans);cursor:pointer}
::selection{background:var(--accent-dim);color:#eafeff}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#0b121d,#090e17);border-bottom:1px solid var(--edge);font-family:var(--mono);font-size:12.5px;min-height:46px;z-index:5}
#hud .brand{color:var(--accent);font-weight:600;letter-spacing:.06em}
#hud .brand b{color:var(--fg)}
#hud .sp{flex:1}
#hud .stat{color:var(--muted)}
#hud .stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);margin-right:5px;vertical-align:middle;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
#stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% -10%,#0e1826 0%,#070a0f 60%)}
#game{position:absolute;inset:0;margin:auto;display:block;touch-action:none}
#prompt{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(9,14,23,.9);border:1px solid var(--edge);border-radius:10px;padding:9px 15px;font-family:var(--mono);font-size:13px;color:var(--fg);display:none;align-items:center;gap:10px;max-width:92%;z-index:4;backdrop-filter:blur(4px)}
#prompt .k{color:var(--accent)}
#prompt.show{display:flex}
#touch{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-left,0px)) 16px;z-index:4;pointer-events:none}
#touch>*{pointer-events:auto}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px;opacity:.85}
.dpad button{border:1px solid var(--edge);background:rgba(16,23,34,.85);color:var(--accent);border-radius:10px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.dpad button:active{background:var(--accent-dim);color:#fff}
.dpad .nd{visibility:hidden}
#actBtn{width:70px;height:70px;border-radius:50%;border:2px solid var(--accent-dim);background:rgba(16,23,34,.9);color:var(--accent);font-family:var(--mono);font-weight:600;font-size:15px;align-self:flex-end}
#actBtn:active{background:var(--accent-dim);color:#fff}
.overlay{position:absolute;inset:0;z-index:20;display:none;background:rgba(4,7,11,.74);backdrop-filter:blur(3px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.show{display:block}
.sheet{max-width:860px;margin:0 auto;min-height:100%;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card.pad{padding:22px}
@media(max-width:520px){.card.pad{padding:16px}}
.pz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pz-top .lvlno{font-family:var(--mono);color:#04181a;background:var(--accent);font-weight:700;border-radius:7px;padding:3px 9px;font-size:13px}
.pz-top h2{font-size:19px;flex:1;min-width:140px}
.diff{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid currentColor}
.diff.d1{color:var(--good)}.diff.d2{color:#7fd9c0}.diff.d3{color:var(--amber)}.diff.d4{color:#ff9f45}.diff.d5{color:var(--red)}.diff.d6{color:var(--violet)}
.x{margin-left:auto;background:transparent;border:1px solid var(--edge);color:var(--muted);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.x:hover{color:var(--fg);border-color:var(--muted)}
.brief{color:var(--muted);font-size:14px;margin:0 0 16px;border-left:2px solid var(--accent-dim);padding-left:12px}
.brief b{color:var(--fg)}
.sect-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
.term{background:var(--panel-2);border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin:4px 0}
.term-bar{display:flex;align-items:center;gap:7px;padding:7px 11px;background:#090e16;border-bottom:1px solid var(--edge);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.term-bar .tl{display:flex;gap:5px}.term-bar .tl i{width:10px;height:10px;border-radius:50%;display:block}
.term-bar .tl i:nth-child(1){background:#ff5f56}.term-bar .tl i:nth-child(2){background:#ffbd2e}.term-bar .tl i:nth-child(3){background:#27c93f}
.term-body{padding:12px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;line-height:1.65}
.term-body.sm{font-size:11.5px}
.c-g{color:var(--accent)}.c-a{color:var(--amber)}.c-r{color:var(--red)}.c-b{color:var(--blue)}.c-m{color:var(--muted)}.c-v{color:var(--violet)}
.clue{cursor:pointer;border-bottom:1px dashed var(--dim);transition:background .12s}
.clue:hover{background:rgba(242,178,62,.12)}
.clue.found{background:rgba(79,212,224,.2);border-bottom:1px solid var(--accent);color:#eafeff}
.clue.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:10px}
table.log{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;min-width:460px}
table.log th{position:sticky;top:0;background:#090e16;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--edge);font-weight:600;white-space:nowrap}
table.log td{padding:6px 10px;border-bottom:1px solid #121a26;white-space:nowrap}
table.log tr:hover td{background:#0d1420}
.pill{font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:12px;font-weight:600}
.pill.ok{background:rgba(79,212,224,.16);color:var(--good)}
.pill.fail{background:rgba(255,93,93,.16);color:var(--red)}
.pill.warn{background:rgba(242,178,62,.16);color:var(--amber)}
.opts{display:flex;flex-direction:column;gap:9px;margin:6px 0}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--edge);border-radius:10px;background:var(--panel-2);text-align:left;color:var(--fg);font-size:13.5px;width:100%}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--accent);background:rgba(79,212,224,.1)}
.opt .box{width:18px;height:18px;border:1px solid var(--dim);border-radius:5px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#04181a}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.radio .box{border-radius:50%}
.opt .tag{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:block;margin-top:3px}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field label{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.field input{background:var(--panel-2);border:1px solid var(--edge);border-radius:9px;padding:11px 13px;color:var(--fg);font-family:var(--mono);font-size:14px}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,212,224,.14)}
.field input.ok{border-color:var(--good)}.field input.bad{border-color:var(--red)}
.order{display:flex;flex-direction:column;gap:7px}
.oitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--edge);border-radius:9px;background:var(--panel-2);font-size:13px}
.oitem .num{font-family:var(--mono);width:22px;height:22px;border-radius:6px;background:var(--edge);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.oitem .mv{margin-left:auto;display:flex;gap:4px}
.oitem .mv button{width:28px;height:28px;border-radius:6px;border:1px solid var(--edge);background:transparent;color:var(--muted);font-size:13px}
.oitem .mv button:hover{color:var(--fg);border-color:var(--muted)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{border:1px solid var(--edge);background:var(--panel-2);color:var(--fg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;font-family:var(--mono)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#04181a;border-color:var(--accent)}
.btn.primary:hover{background:#6ee4ee}
.btn.primary:disabled{background:var(--accent-dim);color:#06222488;opacity:.6;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.sp{margin-left:auto}
.fb{margin-top:16px;border-radius:10px;padding:13px 15px;font-size:13.5px;display:none;border:1px solid}
.fb.show{display:block}
.fb.pass{background:rgba(79,212,224,.1);border-color:var(--accent-dim);color:#c4f6fb}
.fb.fail{background:rgba(255,93,93,.08);border-color:#5a2730;color:#ffc6c6}
.fb.hint{background:rgba(242,178,62,.08);border-color:#5a4620;color:#f4d79a}
.fb b{color:#fff}
.fb .mitre{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:8px;display:block}
.title-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-top:4vh}
.title-wrap .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
.title-wrap h1{font-size:clamp(34px,9vw,60px);letter-spacing:-.01em;line-height:.95;margin:4px 0}
.title-wrap h1 span{color:var(--accent)}
.title-wrap .tag{color:var(--muted);max-width:52ch;margin:6px auto 0;font-size:15px}
.ttable{width:100%;margin-top:22px;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
.ttable td{padding:9px 10px;border-bottom:1px solid var(--edge);text-align:left}
.ttable .n{color:var(--accent);width:26px}.ttable .t{color:var(--fg)}.ttable .d{color:var(--dim);text-align:right;white-space:nowrap}
.legal{color:var(--dim);font-size:12px;margin-top:20px;max-width:60ch}
#missions{position:absolute;top:50px;right:max(10px,env(safe-area-inset-right,0px));z-index:21;width:min(330px,calc(100vw - 20px));display:none}
#missions.show{display:block}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--edge);font-size:13px}
.mrow:last-child{border-bottom:none}
.mrow .st{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700}
.mrow .st.done{background:var(--accent);color:#04181a}
.mrow .st.open{background:var(--panel-2);border:1px solid var(--edge);color:var(--muted)}
.mrow .st.lock{background:transparent;border:1px dashed var(--dim);color:var(--dim)}
.mrow .nm{flex:1}.mrow .nm small{display:block;color:var(--dim);font-family:var(--mono);font-size:10.5px}
.mrow.locked{opacity:.5}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.kv .k{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--edge);border-radius:6px;padding:4px 9px;color:var(--muted)}
.kv .k b{color:var(--fg)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
a{color:var(--blue)}
.hexref{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;font-family:var(--mono);font-size:11.5px}
.hexref div{background:var(--panel-2);border:1px solid var(--edge);border-radius:7px;padding:7px 10px}
.hexref b{color:var(--accent)}
</style>

<div id="app">
  <div id="hud">
    <span class="brand"><b>DEAD</b> DRIVE</span>
    <span class="stat"><span class="dot"></span>EVIDENCE <b id="threatcon">6</b></span>
    <span class="sp"></span>
    <span class="stat">CASES <b><span id="solvedN">0</span>/6</b></span>
    <span class="stat">SCORE <b id="scoreN">0</b></span>
    <span class="stat">TIME <b id="clock">00:00</b></span>
    <button class="btn ghost" id="missBtn" style="padding:6px 12px;font-size:12px">EVIDENCE ▾</button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="prompt"></div>
    <div id="touch">
      <div class="dpad"><button class="nd"></button><button data-d="up">▲</button><button class="nd"></button>
      <button data-d="left">◀</button><button class="nd"></button><button data-d="right">▶</button>
      <button class="nd"></button><button data-d="down">▼</button><button class="nd"></button></div>
      <button id="actBtn">EXAMINE</button>
    </div>
  </div>
  <div class="card" id="missions"></div>
  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

const SAVE_KEY="dead-drive-v1";
let S={solved:[false,false,false,false,false,false],score:0,hints:{},elapsed:0,started:false};
const ACADEMY_PROGRESS_CHANNEL="academy-game-progress-v1";
const academyEmbedded=window.parent!==window;
let academyProgressReady=!academyEmbedded;
function restoreSavedState(raw){
  try{
    const saved=JSON.parse(raw);
    if(!saved||!Array.isArray(saved.solved)||saved.solved.length!==6||saved.solved.some(value=>typeof value!=="boolean")||
       !Number.isFinite(saved.score)||saved.score<0||!saved.hints||typeof saved.hints!=="object"||Array.isArray(saved.hints)||
       !Number.isFinite(saved.elapsed)||saved.elapsed<0||typeof saved.started!=="boolean")return false;
    if(Object.entries(saved.hints).some(([id,count])=>!/^\d$/.test(id)||Number(id)>5||!Number.isInteger(count)||count<0))return false;
    S={solved:[...saved.solved],score:saved.score,hints:{...saved.hints},elapsed:saved.elapsed,started:saved.started};
    return true;
  }catch(e){return false;}
}
function loadAcademyProgress(){
  return new Promise(resolve=>{
    let settled=false;
    const finish=loaded=>{if(settled)return;settled=true;clearTimeout(timer);window.removeEventListener("message",receive);academyProgressReady=loaded;resolve(loaded);};
    const receive=event=>{const message=event.data;if(event.source!==window.parent||!message||message.channel!==ACADEMY_PROGRESS_CHANNEL)return;
      if(message.type==="failed"){finish(false);return;}
      if(message.type==="loaded")finish(message.state===null||(typeof message.state==="string"&&restoreSavedState(message.state)));
    };
    const timer=setTimeout(()=>finish(false),10000);
    window.addEventListener("message",receive);
    window.parent.postMessage({channel:ACADEMY_PROGRESS_CHANNEL,type:"load"},"*");
  });
}
function loadLocalProgress(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw)restoreSavedState(raw);}catch(e){}}
function save(){
  if(academyEmbedded){if(academyProgressReady)window.parent.postMessage({channel:ACADEMY_PROGRESS_CHANNEL,type:"save",state:JSON.stringify(S)},"*");return;}
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}
}
if(academyEmbedded){
  window.addEventListener("message",event=>{const message=event.data;
    if(!academyProgressReady||event.source!==window.parent||!message||message.channel!==ACADEMY_PROGRESS_CHANNEL||message.type!=="flush"||typeof message.requestId!=="string")return;
    tick();save();window.parent.postMessage({channel:ACADEMY_PROGRESS_CHANNEL,type:"flushed",requestId:message.requestId},"*");
  });
}else loadLocalProgress();
let t0=performance.now()-(S.elapsed||0)*1000, running=false;
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function tick(){if(running){S.elapsed=(performance.now()-t0)/1000;$('#clock').textContent=fmt(S.elapsed);}}
setInterval(()=>{tick();if(running&&Math.floor(S.elapsed)%5===0)save();},1000);
function refreshHUD(){const n=S.solved.filter(Boolean).length;$('#solvedN').textContent=n;$('#scoreN').textContent=S.score;$('#threatcon').textContent=6-Math.min(6,n);renderMissions();}

const LEVELS=[
 {id:0,name:"Chain of Custody",diff:1,dname:"Integrity",pts:100,station:"INTAKE",
  mitre:"Evidence integrity · NIST SP 800-86 · hash verification (MD5/SHA-256)"},
 {id:1,name:"File Carving",diff:2,dname:"Signatures",pts:150,station:"CARVE",
  mitre:"T1036.008 Masquerade File Type · magic-byte / file-signature analysis"},
 {id:2,name:"Timeline & Timestomp",diff:3,dname:"Timeline",pts:200,station:"TIMELINE",
  mitre:"T1070.006 Timestomp · $SI vs $FN MACB · Prefetch execution evidence"},
 {id:3,name:"Registry Autopsy",diff:4,dname:"Registry",pts:250,station:"REGISTRY",
  mitre:"T1547.001 Run Keys · USBSTOR device history · AmCache/ShimCache execution"},
 {id:4,name:"Memory Forensics",diff:5,dname:"Memory",pts:300,station:"MEMORY",
  mitre:"T1055 Process Injection · T1003.001 LSASS Dump · Volatility pslist/netscan/malfind"},
 {id:5,name:"Reconstruct & Report",diff:6,dname:"Reporting",pts:400,station:"REPORT",
  mitre:"Defensible timeline · findings vs speculation · chain of custody"},
];
function unlocked(i){return i===0||S.solved[i-1];}

/* ===== HUB ===== */
const cv=$('#game'),ctx=cv.getContext('2d');
const W=960,H=600; cv.width=W;cv.height=H;
const DESKS=[{x:150,y:140,lvl:0},{x:410,y:140,lvl:1},{x:670,y:140,lvl:2},{x:150,y:420,lvl:3},{x:410,y:420,lvl:4},{x:720,y:430,lvl:5,big:true}];
const DESK_W=120,DESK_H=78,BIG_W=180,BIG_H=120;
const player={x:W/2,y:300,w:26,h:34,spd:3.0};
const keys={}; let nearDesk=null;
function deskRect(d){const w=d.big?BIG_W:DESK_W,h=d.big?BIG_H:DESK_H;return {x:d.x,y:d.y,w,h};}
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function updatePlayer(){
  if(overlayOpen)return;
  let dx=0,dy=0;
  if(keys.up)dy-=1;if(keys.down)dy+=1;if(keys.left)dx-=1;if(keys.right)dx+=1;
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  const nx=player.x+dx*player.spd,ny=player.y+dy*player.spd;
  let bx={x:nx,y:player.y,w:player.w,h:player.h},by={x:player.x,y:ny,w:player.w,h:player.h};
  let blockX=false,blockY=false;
  for(const d of DESKS){const r=deskRect(d);if(rectsOverlap(bx,r))blockX=true;if(rectsOverlap(by,r))blockY=true;}
  player.x=Math.max(12,Math.min(W-player.w-12,blockX?player.x:nx));
  player.y=Math.max(12,Math.min(H-player.h-12,blockY?player.y:ny));
  nearDesk=null;let best=1e9;
  for(const d of DESKS){const r=deskRect(d);const cx=r.x+r.w/2,cy=r.y+r.h+22;
    const dist=Math.hypot(player.x+player.w/2-cx,player.y+player.h/2-cy);if(dist<70&&dist<best){best=dist;nearDesk=d;}}

    if(ok){p.classList.add('show');p.innerHTML=`<span class="k">[ EXAMINE / E ]</span> ${S.solved[nearDesk.lvl]?'↻ Reopen':'▶ Open'} — Case ${nearDesk.lvl+1}: ${esc(L.name)}`;}
    else{p.classList.add('show');p.innerHTML=`<span style="color:var(--dim)">🔒 Sealed — close Case ${nearDesk.lvl} first</span>`;}
  }else p.classList.remove('show');
}
let anim=0;
function draw(){
  anim++;ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0f17';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(40,56,78,.35)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  drawWallScreen();
  for(const d of DESKS)drawDesk(d);
  drawPlayer();
  ctx.fillStyle='rgba(69,86,107,.6)';ctx.font='11px "IBM Plex Mono",monospace';ctx.textAlign='left';
  ctx.fillText('DIGITAL FORENSICS LAB — EVIDENCE CTRL',16,H-14);
  ctx.textAlign='right';ctx.fillText('JMOC // CHAIN OF CUSTODY',W-16,H-14);ctx.textAlign='left';
}
function drawWallScreen(){
  const g=ctx.createLinearGradient(0,0,0,70);g.addColorStop(0,'#0a1620');g.addColorStop(1,'#0a0f17');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,70);ctx.strokeStyle='#17283e';ctx.strokeRect(.5,.5,W-1,70);
  const n=S.solved.filter(Boolean).length;
  ctx.font='12px "IBM Plex Mono",monospace';ctx.fillStyle=n>=6?'#4fd4e0':'#f2b23e';ctx.textAlign='center';
  ctx.fillText(n>=6?'● CASE CLOSED — REPORT FILED':'● EXAMINATION IN PROGRESS — '+(6-n)+' ITEM(S) PENDING',W/2,26);
  ctx.strokeStyle='rgba(79,212,224,.5)';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<W;i+=14){const y=46+Math.sin((i+anim*2)/40)*8+Math.sin(i/13)*4;i===0?ctx.moveTo(i,y):ctx.lineTo(i,y);}
  ctx.stroke();ctx.textAlign='left';
}
function drawDesk(d){
  const r=deskRect(d),L=LEVELS[d.lvl],ok=unlocked(d.lvl),done=S.solved[d.lvl];
  ctx.fillStyle='rgba(0,0,0,.35)';roundRect(r.x+4,r.y+6,r.w,r.h,8);ctx.fill();
  ctx.fillStyle=done?'#0d2629':ok?'#141f2e':'#111722';roundRect(r.x,r.y,r.w,r.h,8);ctx.fill();
  ctx.strokeStyle=done?'#2a7f88':ok?'#28405e':'#1c2433';ctx.lineWidth=1.5;roundRect(r.x,r.y,r.w,r.h,8);ctx.stroke();
  const mw=r.w*0.56,mh=r.h*0.42,mx=r.x+(r.w-mw)/2,my=r.y+10;
  const col=done?'#4fd4e0':ok?'#56a8ff':'#45566b';
  if(ok&&!done){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=14+Math.sin(anim/20)*5;}
  else if(done){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=10;}else ctx.save();
  ctx.fillStyle=done?'#0b3338':ok?'#0a2238':'#0c1119';roundRect(mx,my,mw,mh,4);ctx.fill();ctx.restore();
  ctx.strokeStyle=col;ctx.lineWidth=1.5;roundRect(mx,my,mw,mh,4);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
  for(let y=my+4;y<my+mh;y+=4){ctx.beginPath();ctx.moveTo(mx+3,y);ctx.lineTo(mx+mw-3,y);ctx.stroke();}
  ctx.font='bold 14px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;
  ctx.fillText(done?'✓':ok?(d.lvl+1):'🔒',mx+mw/2,my+mh/2);ctx.textBaseline='alphabetic';
  ctx.font='10.5px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.fillStyle=ok?'#8aa0ba':'#45566b';
  ctx.fillText((d.big?'REPORT DESK':'BENCH '+L.station),r.x+r.w/2,r.y+r.h+16);
  ctx.fillStyle=done?'#4fd4e0':ok?'#cdd8e6':'#45566b';ctx.font='11px "IBM Plex Sans",sans-serif';
  wrapText('Case '+(d.lvl+1)+': '+L.name,r.x+r.w/2,r.y+r.h+30,r.w+40,12);ctx.textAlign='left';
}
function wrapText(txt,cx,y,maxw,lh){const words=txt.split(' ');let line='';let yy=y;
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxw&&line){ctx.fillText(line,cx,yy);line=w;yy+=lh;}else line=test;}ctx.fillText(line,cx,yy);}
function drawPlayer(){
  const p=player;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(p.x+p.w/2,p.y+p.h,14,5,0,0,7);ctx.fill();
  ctx.fillStyle='#e6edf2';roundRect(p.x,p.y+10,p.w,p.h-10,5);ctx.fill();   // lab coat
  ctx.strokeStyle='#4fd4e0';ctx.lineWidth=1.2;roundRect(p.x,p.y+10,p.w,p.h-10,5);ctx.stroke();
  ctx.fillStyle='#d8b48a';ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+8,8,0,7);ctx.fill();
  ctx.fillStyle='#1a2633';ctx.fillRect(p.x+5,p.y+16,p.w-10,3); // badge line

}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function resetGame(){S={solved:[false,false,false,false,false,false],score:0,hints:{},elapsed:0,started:false};
  save();t0=performance.now();running=false;refreshHUD();closeOverlay();player.x=W/2;player.y=300;showTitle();}
window.resetGame=resetGame;
function showTitle(){
  const resume=S.solved.some(Boolean);
  const rows=LEVELS.map(L=>`<tr><td class="n">${L.id+1}</td><td class="t">${esc(L.name)}</td>
    <td class="d">${'◆'.repeat(Math.min(L.diff,6))} ${esc(L.dname)}</td></tr>`).join('');
  openOverlay(`<div class="card pad"><div class="title-wrap">
    <span class="eyebrow">A digital-forensics puzzle</span>
    <h1>DEAD <span>DRIVE</span></h1>
    <p class="tag">A host was compromised and someone tried to cover their tracks. The disk, the registry, and the RAM are on your bench. Acquire it right, read the artifacts, catch the timestomp and the hidden process, and reconstruct exactly what happened — then write a report that holds up.</p>
    <table class="ttable">${rows}</table>
    <p class="legal">Six cases, roughly 60–90 minutes, each harder than the last. Pure defensive DFIR — acquire, analyze, attribute carefully, report. Move with <kbd>WASD</kbd>/<kbd>arrows</kbd>, examine with <kbd>E</kbd>/<kbd>Enter</kbd> (or the on-screen pad). Hints cost points.</p></div>

}
try{
  const boot=async(data)=>{
    if(academyEmbedded){
      openOverlay('<div class="card pad"><p class="eyebrow">SAVED PROGRESS</p><h2>Loading your progress</h2><p>Your saved progress is loading from the Academy.</p></div>');
      if(!await loadAcademyProgress()){
        openOverlay('<div class="card pad"><p class="eyebrow">SAVED PROGRESS</p><h2>Could not load your progress</h2><p>Keep the game open and check your connection. Your saved progress has not been replaced.</p><button class="btn primary" id="retryAcademyProgress">Retry</button></div>');
        $('#retryAcademyProgress').onclick=()=>boot(data);return;
      }
    }else if(data&&data.S){S=Object.assign(S,data.S);}
    t0=performance.now()-(S.elapsed||0)*1000;

    if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
  };
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);

}catch(e){refreshHUD();fit();loop();showTitle();}
